services:
  user-api:
    build: .
    command: ["python", "-m", "uvicorn", "backend.user_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: transfer-root-password
      MYSQL_DATABASE: fraud_detection
    depends_on:
      mysql:
        condition: service_healthy
